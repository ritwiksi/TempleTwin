name: Build

on:
  push:
    branches:
      - milestone-1-3d-poc
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite production bundle
        run: npx vite build
